set_fertilized:
  name: Rasen-Düngung eintragen
  description: Registriert das Datum der letzten Rasendüngung zur genauen Berechnung des Wachstumsschubs.
  fields:
    date:
      name: Datum
      description: Datum der Düngung (Standard ist heute).
      selector:
        date:

start_mowing:
  name: Mähvorgang starten
  description: Startet den Mähroboter unter Berücksichtigung eventuell konfigurierter Kantenschnitt-Dienste.

dock_mower:
  name: Mähroboter parken
  description: Ruft den Mähroboter sofort zur Ladestation zurück.

reset_daily_budget:
  name: Tagesbudget zurücksetzen
  description: Setzt die heute bereits gemähten Minuten auf 0 zurück.

set_moisture_score:
  name: Rasenfeuchte-Score setzen
  description: Kalibriert oder setzt den internen Rasenfeuchte-Score von MowMaster (0.0 = staubtrocken bis 100.0 = regennass).
  fields:
    moisture_score:
      name: Nässe-Score
      description: Neuer Wert für den internen Nässe-Score (0 bis 100 pts).
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: pts


